name: Publish platform natives

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - name: Publish all platform packages with binaries
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$TOKEN" > "$HOME/.npmrc"
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          unset npm_config_workspace || true
          unset npm_config_workspaces || true
          npm whoami
          ROOT=packages/npm
          [ -d "$ROOT" ] || ROOT=npm
          ok=0
          fail=0
          for dir in "$ROOT"/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./${dir}package.json').name")
            ver=$(node -p "require('./${dir}package.json').version")
            bin=$(find "$dir" -maxdepth 1 -type f -executable ! -name '.*' | head -1 || true)
            if [ -z "$bin" ] || [ ! -s "$bin" ]; then
              echo "skip $name (no binary)"
              continue
            fi
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo already live "$name@$ver"
              ok=$((ok+1))
              continue
            fi
            echo "Publishing $name@$ver from $dir"
            set +e
            out=$(cd "$dir" && npm publish --access public 2>&1)
            rc=$?
            set -e
            echo "$out"
            if echo "$out" | grep -q "+ $name@$ver"; then
              for i in $(seq 1 36); do
                if npm view "$name@$ver" version >/dev/null 2>&1; then
                  echo readback ok
                  ok=$((ok+1))
                  break
                fi
                sleep 5
              done
              # if still not visible but published, count as ok with note
              if ! npm view "$name@$ver" version >/dev/null 2>&1; then
                echo "WARN published but delayed CDN $name@$ver"
                ok=$((ok+1))
              fi
            elif echo "$out" | grep -qi "previously published\|EPUBLISHCONFLICT\|cannot publish over"; then
              echo "version exists/burned for $name@$ver — need bump"
              fail=$((fail+1))
            else
              echo "publish failed $name"
              fail=$((fail+1))
            fi
          done
          echo "ok=$ok fail=$fail"
          test "$ok" -ge 1
          test "$fail" -eq 0
