name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to publish package.json version to npm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: sylphx-linux-standard
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_WORKSPACES: 'false'
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          npm config set "//registry.npmjs.org/:_authToken" "$TOKEN"
          npm whoami --workspaces=false || npm whoami
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$VER from ."
          if npm view "$NAME@$VER" version --workspaces=false >/dev/null 2>&1; then
            echo "Already published: $NAME@$VER"
            npm view "$NAME" version dist-tags --workspaces=false || true
            exit 0
          fi
          npm publish --access public --workspaces=false
          npm view "$NAME@$VER" version --workspaces=false
