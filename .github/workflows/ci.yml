name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Enforce owned CI runner profiles
        run: python3 .github/scripts/check-owned-runner-profiles.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test
      - run: bun run check
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      - run: bun run test:rust-timeline
      - run: bun run benchmark:release-gate
